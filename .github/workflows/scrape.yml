name: Scrape Manhwa Data

on:
  schedule:
    - cron: '0 */12 * * *' # تشغيل كل 12 ساعة
  workflow_dispatch: # إمكانية التشغيل اليدوي بنقرة زر
  push:
    branches:
      - main

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add manhwa.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update manhwa.json database [skip ci]" && git push)
