name: جمع المانهوا

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: جلب الملفات
        uses: actions/checkout@v4

      - name: تثبيت بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: تثبيت المكتبات
        run: pip install requests beautifulsoup4

      - name: تشغيل السكريبت
        run: python scraper.py

      - name: حفظ الملفات
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add manhwa.json
          git commit -m "تحديث المانهوا تلقائياً" || exit 0
          git push
