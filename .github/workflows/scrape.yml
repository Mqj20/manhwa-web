name: Scrape Manhwa Data

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'manhwa.json' # يمنع تشغيل الأكشن مجدداً عند تحديث ملف الـ JSON تلقائياً

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install curl_cffi beautifulsoup4

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add manhwa.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update manhwa.json [HEAD]" && git push)
