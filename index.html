<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b14">
  <title>MQJ Manhwa — مكتبة المانهوا</title>
  <meta name="description" content="مكتبة مانهوا حديثة مع آلاف العناوين، البحث، التصنيفات، الفصول والقارئ.">
  <link rel="preconnect" href="https://api.mangadex.org">
  <link rel="preconnect" href="https://uploads.mangadex.org">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>
  <header class="topbar">
    <a class="brand" href="#" data-home>
      <span class="brand-mark">MQJ</span>
      <span><b>MQJ</b><small>MANHWA</small></span>
    </a>
    <nav>
      <a href="#home" data-home>الرئيسية</a>
      <a href="#latest" data-sort="latest">الأحدث</a>
      <a href="#popular" data-sort="popular">الأكثر متابعة</a>
      <a href="#library" data-library>مكتبتي</a>
    </nav>
    <button class="icon-btn" id="themeBtn" aria-label="تبديل المظهر">☼</button>
  </header>

  <main>
    <section class="hero" id="home">
      <div>
        <span class="eyebrow">مكتبة رقمية ضخمة</span>
        <h1>آلاف المانهوا.<br><em>مكان واحد.</em></h1>
        <p>ابحث، اكتشف، احفظ، واقرأ الفصول المتاحة من واجهة سريعة ومصممة للهاتف والشاشات الكبيرة.</p>
        <div class="hero-search">
          <input id="searchInput" placeholder="ابحث عن اسم المانهوا..." autocomplete="off">
          <button id="searchBtn">بحث</button>
        </div>
        <div class="chips">
          <button data-tag="Action">أكشن</button><button data-tag="Romance">رومانسية</button>
          <button data-tag="Fantasy">فانتازيا</button><button data-tag="Comedy">كوميديا</button>
          <button data-tag="Adventure">مغامرات</button><button data-tag="Drama">دراما</button>
        </div>
      </div>
      <div class="hero-card">
        <div class="orbit"></div>
        <div class="hero-stat"><b id="countLabel">آلاف العناوين</b><span>تُجلب مباشرة من المصدر</span></div>
      </div>
    </section>

    <section class="toolbar">
      <div>
        <h2 id="sectionTitle">استكشف المانهوا</h2>
        <p id="sectionSub">تصفح مكتبة ضخمة مع تحميل تدريجي.</p>
      </div>
      <div class="controls">
        <select id="statusFilter">
          <option value="">كل الحالات</option><option value="ongoing">مستمرة</option>
          <option value="completed">مكتملة</option><option value="hiatus">متوقفة مؤقتاً</option>
        </select>
        <select id="orderFilter">
          <option value="followedCount">الأكثر متابعة</option>
          <option value="latestUploadedChapter">أحدث الفصول</option>
          <option value="rating">الأعلى تقييماً</option>
          <option value="relevance">الأكثر صلة</option>
        </select>
      </div>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>
    <div id="loader" class="loader">جارِ تحميل المانهوا...</div>
    <button id="moreBtn" class="more">تحميل المزيد</button>
  </main>

  <div class="modal" id="detailsModal" aria-hidden="true">
    <div class="modal-box">
      <button class="close" data-close>×</button>
      <div id="details"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
